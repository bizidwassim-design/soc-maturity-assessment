name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check every script
        run: |
          for f in assets/app.js data/questions.js data/sample.js scripts/*.js; do
            node --check "$f"
          done

      - name: Question bank has 50 questions in 6 domains with complete levels and next steps
        run: node scripts/check_questions.js

      - name: Generated CSV and sample export are up to date
        run: |
          node scripts/build_data.js
          git diff --exit-code -- data/questions.csv examples/northwind-sample.json

      - name: Sample export is valid JSON with the expected shape
        run: |
          python - <<'EOF'
          import json
          doc = json.load(open("examples/northwind-sample.json", encoding="utf-8"))
          assert doc["schema"] == "soc-maturity-assessment/1.0", doc["schema"]
          assert doc["answered"] == 50 and doc["total"] == 50
          assert len(doc["domains"]) == 6 and len(doc["top_gaps"]) == 10
          assert all(0 <= v <= 4 for v in doc["answers"].values())
          print("OK:", doc["organisation"], doc["overall_score"], doc["overall_level"])
          EOF

      - name: HTML is valid (html-validate, recommended preset)
        run: npx --yes html-validate@8 index.html

      - name: No external resources or inline scripts (CSP stays meaningful)
        run: |
          ! grep -Ei '<(script|link)[^>]+(src|href)="(https?:)?//' index.html
          ! grep -Ei '<script>' index.html
          ! grep -Ei '@import|url\(https?:' assets/style.css
          echo "OK: all resources are local"
